labels.forEach((label,i)=>{let wrap=document.createElement("label");wrap.className="option";let input=document.createElement("input");input.type=q[0]==="多选"?"checkbox":"radio";input.name="answer";input.value=q[0]==="判断"?(i===0?"正确":"错误"):String.fromCharCode(65+i);input.checked=chosen.includes(input.value);if(answered[q.id]?.done){let key=input.value;let correct=q[4].split("");if(correct.includes(key)||q[4]===key)wrap.classList.add("correct");else if(chosen.includes(key))wrap.classList.add("wrong");input.disabled=true;}wrap.append(input,document.createTextNode(label));$("opts").append(wrap);input.addEventListener("change",()=>{if(q[0]!=="多选")submit()})});
$("feedback").className="hidden";if(answered[q.id]?.done)showFeedback(q,answered[q.id]);$("submit").disabled=!!answered[q.id]?.done;$("prev").disabled=idx===0;$("next").textContent=idx===pool.length-1?"查看结果":"下一题";$("mark").textContent=marked.has(q.id)?"★ 已标记":"☆ 标记";$("stats").textContent=`累计正确 ${score}｜错题本 ${wrong.size} 题`}
function chosenNow(){return [...document.querySelectorAll("#opts input:checked")].map(x=>x.value)}
function submit(){let q=pool[idx];let chosen=chosenNow();if(!chosen.length){alert("请先选择答案");return}let ans=q[4].split("");let ok=chosen.length===ans.length&&chosen.every(x=>ans.includes(x));answered[q.id]={chosen,done:true,ok};if(ok){score++;wrong.delete(q.id)}else wrong.add(q.id);localStorage.setItem("sensorWrong",JSON.stringify([...wrong]));render();showFeedback(q,answered[q.id])}
function showFeedback(q,a){let box=$("feedback");box.className="feedback "+(a.ok?"ok":"bad");let answer=q[0]==="判断"?q[4]:(q[0]==="多选"?q[4].split("").join("、"):q[4]);let chosen=a.chosen.join("、");box.innerHTML=`<b>${a.ok?"回答正确 ✓":"回答错误 ✗"}</b><div>你的答案：${chosen}</div><div>正确答案：${answer}</div><div class="explain"><b>解析：</b>${q[5]}</div>${!a.ok?`<div class="explain"><b>错误分析：</b>你选择的答案与题库答案不一致。请结合上方解析辨析相关概念，重点记忆正确选项所对应的原理。</div>`:""}`;$("submit").disabled=true}
$("submit").onclick=submit;$("prev").onclick=()=>{if(idx>0){idx--;render()}};$("next").onclick=()=>{if(idx<pool.length-1){idx++;render()}else finish()};$("restart").onclick=setup;["type","unit","mode"].forEach(id=>$(id).onchange=setup);$("mark").onclick=()=>{let id=pool[idx].id;marked.has(id)?marked.delete(id):marked.add(id);render()};
function finish(){let done=pool.filter(q=>answered[q.id]?.done).length;let right=pool.filter(q=>answered[q.id]?.ok).length;$("quiz").classList.add("hidden");$("result").classList.remove("hidden");$("result").innerHTML=`<h2>本轮完成</h2><p>已作答 ${done} / ${pool.length}</p><p style="font-size:36px;color:#2563eb">${right} / ${pool.length}</p><p>正确率：${pool.length?Math.round(right/pool.length*100):0}%</p><button class="primary" onclick="setup()">再刷一轮</button> <button onclick="wrongMode()">复习错题</button>`}
function wrongMode(){$("mode").value="错题";setup()}
setup();
</script></body></html>
